name: Build and Release

on:
  push:
    tags:
      - 'v*'  # Triggers on version tags like v1.0.5

jobs:
  build:
    runs-on: macos-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Build Release
        run: |
          xcodebuild -workspace AnimatedWallpaper.xcworkspace \
                     -scheme AnimatedWallpaper \
                     -configuration Release \
                     -derivedDataPath build \
                     build

      - name: Create App Icon
        run: |
          mkdir -p /tmp/AppIcon.iconset
          cp AnimatedWallpaper/Assets.xcassets/AppIcon.appiconset/icon_*.png /tmp/AppIcon.iconset/
          iconutil -c icns /tmp/AppIcon.iconset -o /tmp/AppIcon.icns
          cp /tmp/AppIcon.icns build/Build/Products/Release/AnimatedWallpaper.app/Contents/Resources/
          /usr/libexec/PlistBuddy -c "Add :CFBundleIconFile string AppIcon" \
            build/Build/Products/Release/AnimatedWallpaper.app/Contents/Info.plist 2>/dev/null || true

      - name: Create Installer
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          
          # Create staging
          mkdir -p installer/staging
          cp -R build/Build/Products/Release/AnimatedWallpaper.app installer/staging/
          
          # Create package
          pkgbuild --root installer/staging \
                   --install-location /Applications \
                   --identifier com.davidmedvedev.animatedwallpaper \
                   --version "$VERSION" \
                   installer/AnimatedWallpaper-component.pkg
          
          cd installer
          productbuild --distribution distribution.xml \
                       --resources resources \
                       --package-path . \
                       AnimatedWallpaper-Installer.pkg

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: installer/AnimatedWallpaper-Installer.pkg
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update Homebrew Tap
        env:
          TAP_GITHUB_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN }}
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          
          # Calculate SHA256 of the installer
          SHA256=$(shasum -a 256 installer/AnimatedWallpaper-Installer.pkg | awk '{print $1}')
          
          # Clone the tap repo
          git clone https://x-access-token:${TAP_GITHUB_TOKEN}@github.com/dodabuilt/homebrew-tap.git tap-repo
          cd tap-repo
          
          # Update the cask formula
          cat > Casks/animated-wallpaper.rb << EOF
          cask "animated-wallpaper" do
            version "$VERSION"
            sha256 "$SHA256"

            url "https://github.com/dodabuilt/AnimatedWallpaper/releases/download/v#{version}/AnimatedWallpaper-Installer.pkg"
            name "Animated Wallpaper"
            desc "Transform your macOS desktop with animated video and GIF wallpapers"
            homepage "https://github.com/dodabuilt/AnimatedWallpaper"

            pkg "AnimatedWallpaper-Installer.pkg"

            uninstall pkgutil: "com.davidmedvedev.animatedwallpaper",
                      delete:  "/Applications/AnimatedWallpaper.app"

            zap trash: [
              "~/Library/Application Support/AnimatedWallpaper",
              "~/Library/Preferences/com.dash.animatedwallpaper.plist",
              "~/Library/Caches/com.dash.animatedwallpaper",
            ]

            caveats <<~EOS
              After installation, open Animated Wallpaper from your Applications folder.
              Look for the icon in your menu bar to get started!
            EOS
          end
          EOF
          
          # Commit and push
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add Casks/animated-wallpaper.rb
          git commit -m "Update animated-wallpaper to v$VERSION"
          git push

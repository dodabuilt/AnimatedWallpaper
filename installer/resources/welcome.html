<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            padding: 20px;
            line-height: 1.6;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            color: #eee;
            min-height: 100vh;
            margin: 0;
        }
        h1 {
            color: #4fc3f7;
            font-size: 28px;
            margin-bottom: 10px;
            text-shadow: 0 0 20px rgba(79, 195, 247, 0.5);
        }
        .author {
            color: #888;
            font-size: 12px;
            margin-bottom: 20px;
        }
        p {
            color: #ccc;
            font-size: 14px;
        }
        ul {
            color: #ccc;
            font-size: 14px;
        }
        li {
            margin: 8px 0;
        }
        .pixel-accent {
            display: inline-block;
            width: 8px;
            height: 8px;
            background: #4fc3f7;
            margin-right: 8px;
            box-shadow: 0 0 10px #4fc3f7;
        }
    </style>
</head>
<body>
    <h1>⬛ Animated Wallpaper</h1>
    <p class="author">Created by David Medvedev</p>
    <p>Transform your desktop with animated wallpapers!</p>
    <p><strong>Features:</strong></p>
    <ul>
        <li><span class="pixel-accent"></span>Set videos or GIFs as your desktop wallpaper</li>
        <li><span class="pixel-accent"></span>Build and manage a wallpaper library</li>
        <li><span class="pixel-accent"></span>Multi-monitor support</li>
        <li><span class="pixel-accent"></span>Lives in your menu bar</li>
    </ul>
    <p>Click <strong>Continue</strong> to install.</p>
</body>
</html>
